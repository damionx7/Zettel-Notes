name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # A tag builds only the version that is committed: fail in seconds, before the tests run,
  # when someone tags without bumping first (`node scripts/bump-version.mjs`).
  version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check that the tag matches the committed version
        run: node scripts/bump-version.mjs --check "$GITHUB_REF_NAME"

  quality:
    needs: version
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-ci.yml

  build:
    needs: quality
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - build: macos
            os: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - build: macos
            # Cross-compiled on Intel: hosted Apple Silicon runners are often unavailable.
            os: macos-26-intel
            arch: aarch64
            target: aarch64-apple-darwin
          - build: windows
            os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      # Reuse the Yarn packages that main's test runs cache, to skip their download.
      - name: Restore the Yarn package cache
        uses: actions/cache/restore@v5
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev patchelf libgtk-3-dev librsvg2-dev libxcb-shape0-dev libxcb-xfixes0-dev libsoup-3.0 javascriptcoregtk-4.1 webkit2gtk-4.1 pkg-config libfreetype6-dev libfontconfig1-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup
        run: yarn setup

      - name: Build workspaces
        run: yarn build

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Skip updater signatures when no signing key is configured
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo "::warning::TAURI_PRIVATE_KEY is not set, so packages are built without updater signatures."
          node -e "const fs=require('fs');const f='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"

      # Hosted macOS runners intermittently fail `hdiutil create` with "Resource busy" while
      # XProtect scans new disk images, which fails the DMG after a full build. Stop XProtect
      # and retry that one command on this error.
      - name: Retry disk image creation when macOS reports it busy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          shim="$RUNNER_TEMP/hdiutil-retry"
          mkdir -p "$shim"
          cat > "$shim/hdiutil" <<'SHIM'
          #!/bin/bash
          [ "$1" = create ] || exec /usr/bin/hdiutil "$@"
          for attempt in 1 2 3 4 5; do
            errors=$(mktemp)
            /usr/bin/hdiutil "$@" 2> "$errors"
            status=$?
            cat "$errors" >&2
            if [ $status -eq 0 ] || ! grep -q 'Resource busy' "$errors"; then rm -f "$errors"; exit $status; fi
            rm -f "$errors"
            image="${@: -1}"
            rm -f "$image" "$image.dmg"
            echo "hdiutil create: resource busy, retrying ($attempt/5)" >&2
            sleep $((attempt * 10))
          done
          exit $status
          SHIM
          chmod +x "$shim/hdiutil"
          echo "$shim" >> "$GITHUB_PATH"

      - name: Build the app
        run: yarn build:desktop --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseDir = Join-Path "target/${{ matrix.target }}" "release"
          $exe = Join-Path $releaseDir "zettel-notes.exe"

          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Release executable not found: $exe"
          }

          $portableRoot = Join-Path $env:RUNNER_TEMP "Zettel-Notes-portable-package"
          $portableDir = Join-Path $portableRoot "Zettel-Notes-portable"
          $portableOutput = Join-Path $releaseDir "bundle/portable"
          $portableZip = Join-Path $portableOutput "Zettel-Notes_${version}_x64_portable.zip"

          Remove-Item -LiteralPath $portableRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          New-Item -ItemType Directory -Path $portableOutput -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $portableDir "Zettel Notes.exe")
          $themeLicenses = Join-Path $portableDir "licenses/themes"
          New-Item -ItemType Directory -Path $themeLicenses -Force | Out-Null
          Copy-Item -Path "packages/theme/licenses/*.txt" -Destination $themeLicenses
          Compress-Archive -Path $portableDir -DestinationPath $portableZip -Force

      - uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-22.04'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/appimage/**.AppImage.*
            ./target/${{ matrix.target }}/release/bundle/appimage/**.AppImage
            ./target/${{ matrix.target }}/release/bundle/deb/**.deb
            ./target/${{ matrix.target }}/release/bundle/deb/**.deb.sig
            ./target/${{ matrix.target }}/release/bundle/rpm/**.rpm
            ./target/${{ matrix.target }}/release/bundle/rpm/**.rpm.sig

      - uses: actions/upload-artifact@v6
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: aarch64artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/macos/**.app.*

      - uses: actions/upload-artifact@v6
        if: matrix.target == 'x86_64-apple-darwin'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/macos/**.app.*

      - uses: actions/upload-artifact@v6
        if: matrix.os == 'windows-latest'
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/msi/**
            ./target/${{ matrix.target }}/release/bundle/nsis/**
            ./target/${{ matrix.target }}/release/bundle/portable/**.zip

  # One disk image for every Mac. Per-architecture images let Apple Silicon users install the
  # Intel build by mistake, which then fails with "bad CPU type in executable". The
  # per-architecture .app.tar.gz files stay for the updater, which picks one per architecture.
  macos-universal:
    needs: build
    permissions:
      contents: read
    runs-on: macos-26-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the macOS apps
        uses: actions/download-artifact@v7
        with:
          pattern: '*artifacts-*-apple-darwin'
          path: macos-apps

      # Hosted macOS runners intermittently fail `hdiutil create` with "Resource busy" while
      # XProtect scans new disk images, which fails the DMG after a full build. Stop XProtect
      # and retry that one command on this error.
      - name: Retry disk image creation when macOS reports it busy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          shim="$RUNNER_TEMP/hdiutil-retry"
          mkdir -p "$shim"
          cat > "$shim/hdiutil" <<'SHIM'
          #!/bin/bash
          [ "$1" = create ] || exec /usr/bin/hdiutil "$@"
          for attempt in 1 2 3 4 5; do
            errors=$(mktemp)
            /usr/bin/hdiutil "$@" 2> "$errors"
            status=$?
            cat "$errors" >&2
            if [ $status -eq 0 ] || ! grep -q 'Resource busy' "$errors"; then rm -f "$errors"; exit $status; fi
            rm -f "$errors"
            image="${@: -1}"
            rm -f "$image" "$image.dmg"
            echo "hdiutil create: resource busy, retrying ($attempt/5)" >&2
            sleep $((attempt * 10))
          done
          exit $status
          SHIM
          chmod +x "$shim/hdiutil"
          echo "$shim" >> "$GITHUB_PATH"

      - name: Build the universal disk image
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/macos-universal-dmg.sh \
            "macos-apps/artifacts-x86_64-apple-darwin/Zettel Notes.app.tar.gz" \
            "macos-apps/aarch64artifacts-aarch64-apple-darwin/Zettel Notes.app.tar.gz" \
            "universal/Zettel Notes_${version}_universal.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-universal
          path: ./universal/*.dmg

  build-offline-installer:
    needs: quality
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: windows-offline-installer
            os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_PRIVATE_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      # Reuse the Yarn packages that main's test runs cache, to skip their download.
      - name: Restore the Yarn package cache
        uses: actions/cache/restore@v5
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup
        run: yarn setup

      - name: Use offline bundle
        if: matrix.os == 'windows-latest'
        run: yarn use-offline-bundle

      - name: Build workspaces
        run: yarn build

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}

      - name: Skip updater signatures when no signing key is configured
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          echo "::warning::TAURI_PRIVATE_KEY is not set, so packages are built without updater signatures."
          node -e "const fs=require('fs');const f='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"

      # Hosted macOS runners intermittently fail `hdiutil create` with "Resource busy" while
      # XProtect scans new disk images, which fails the DMG after a full build. Stop XProtect
      # and retry that one command on this error.
      - name: Retry disk image creation when macOS reports it busy
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          shim="$RUNNER_TEMP/hdiutil-retry"
          mkdir -p "$shim"
          cat > "$shim/hdiutil" <<'SHIM'
          #!/bin/bash
          [ "$1" = create ] || exec /usr/bin/hdiutil "$@"
          for attempt in 1 2 3 4 5; do
            errors=$(mktemp)
            /usr/bin/hdiutil "$@" 2> "$errors"
            status=$?
            cat "$errors" >&2
            if [ $status -eq 0 ] || ! grep -q 'Resource busy' "$errors"; then rm -f "$errors"; exit $status; fi
            rm -f "$errors"
            image="${@: -1}"
            rm -f "$image" "$image.dmg"
            echo "hdiutil create: resource busy, retrying ($attempt/5)" >&2
            sleep $((attempt * 10))
          done
          exit $status
          SHIM
          chmod +x "$shim/hdiutil"
          echo "$shim" >> "$GITHUB_PATH"

      - name: Build the app
        run: yarn build:desktop --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v6
        if: matrix.os == 'windows-latest'
        with:
          name: offline-installer-artifacts-${{ matrix.target }}
          path: |
            ./target/${{ matrix.target }}/release/bundle/msi/**
            ./target/${{ matrix.target }}/release/bundle/nsis/**

  release:
    permissions:
      contents: write
    needs: [build, macos-universal, build-offline-installer]
    runs-on: ubuntu-24.04
    env:
      HAS_SIGNING_KEY: ${{ secrets.TAURI_PRIVATE_KEY != '' }}
    steps:
      - name: Query version number
        run: echo "version=${GITHUB_REF:11}" >> $GITHUB_ENV

      # Full history, so the release notes can list the commits since the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Writes release-notes/body.md (the GitHub release text) and apps/desktop/release-notes.md
      # (the same list under "## vX.Y.Z", which `yarn updater` puts in install.json; the CLI
      # only reads a log file inside apps/desktop).
      - name: Write release notes from the commits since the previous tag
        run: |
          mkdir -p release-notes
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..${GITHUB_SHA}"
            heading="Changes since ${previous}"
          else
            range="${GITHUB_SHA}"
            heading="Changes"
          fi
          commits=$(git log --no-merges --pretty=format:'- %s (%h)' "$range")
          [ -n "$commits" ] || commits="- No code changes since ${previous}."
          {
            echo "## Zettel Notes v${version}"
            echo
            echo "### ${heading}"
            echo
            echo "$commits"
          } > release-notes/body.md
          {
            echo "## v${version}"
            echo
            echo "$commits"
          } > apps/desktop/release-notes.md
          cat release-notes/body.md

      - name: Download x86_64 artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: artifacts-*
          path: artifacts/x86_64
          merge-multiple: true

      - name: Download aarch64 artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: aarch64artifacts-*
          path: artifacts/aarch64
          merge-multiple: true

      - name: Download the universal macOS disk image
        uses: actions/download-artifact@v7
        with:
          name: macos-universal
          path: artifacts/universal

      - name: Download offline installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: offline-installer-artifacts-*
          path: artifacts/offline-installer
          merge-multiple: true

      - name: Rename artifacts
        run: |
          # Updater signatures exist only when TAURI_PRIVATE_KEY is configured.
          mv_sig() { if [ -f "$1" ]; then mv "$1" "$2"; elif [ "$HAS_SIGNING_KEY" = "true" ]; then echo "Missing signature: $1" >&2; return 1; fi; }

          mv "artifacts/universal/Zettel Notes_${{ env.version }}_universal.dmg" "artifacts/Zettel-Notes_v${{ env.version }}_macOS_universal.dmg"

          # Each macOS artifact holds only bundle/macos/, so upload-artifact stores its files at the top.
          mv "artifacts/aarch64/Zettel Notes.app.tar.gz" "artifacts/Zettel-Notes_aarch64.app.tar.gz"
          mv_sig "artifacts/aarch64/Zettel Notes.app.tar.gz.sig" "artifacts/Zettel-Notes_aarch64.app.tar.gz.sig"

          mv "artifacts/x86_64/Zettel Notes.app.tar.gz" "artifacts/Zettel-Notes_x64.app.tar.gz"
          mv_sig "artifacts/x86_64/Zettel Notes.app.tar.gz.sig" "artifacts/Zettel-Notes_x64.app.tar.gz.sig"

          mv "artifacts/x86_64/deb/Zettel Notes_${{ env.version }}_amd64.deb" "artifacts/Zettel-Notes_v${{ env.version }}_amd64.deb"
          mv_sig "artifacts/x86_64/deb/Zettel Notes_${{ env.version }}_amd64.deb.sig" "artifacts/Zettel-Notes_v${{ env.version }}_amd64.deb.sig"
          mv "artifacts/x86_64/appimage/Zettel Notes_${{ env.version }}_amd64.AppImage" "artifacts/Zettel-Notes_v${{ env.version }}_amd64.AppImage"
          mv_sig "artifacts/x86_64/appimage/Zettel Notes_${{ env.version }}_amd64.AppImage.sig" "artifacts/Zettel-Notes_v${{ env.version }}_amd64.AppImage.sig"
          mv "artifacts/x86_64/rpm/Zettel Notes-${{ env.version }}-1.x86_64.rpm" "artifacts/Zettel-Notes-${{ env.version }}-1.x86_64.rpm"
          mv_sig "artifacts/x86_64/rpm/Zettel Notes-${{ env.version }}-1.x86_64.rpm.sig" "artifacts/Zettel-Notes-${{ env.version }}-1.x86_64.rpm.sig"

          mv "artifacts/x86_64/msi/Zettel Notes_${{ env.version }}_x64_en-US.msi" "artifacts/Zettel-Notes_v${{ env.version }}_x64.msi"
          mv_sig "artifacts/x86_64/msi/Zettel Notes_${{ env.version }}_x64_en-US.msi.sig" "artifacts/Zettel-Notes_v${{ env.version }}_x64.msi.sig"

          mv "artifacts/x86_64/nsis/Zettel Notes_${{ env.version }}_x64-setup.exe" "artifacts/Zettel-Notes_v${{ env.version }}_x64-setup.exe"
          mv_sig "artifacts/x86_64/nsis/Zettel Notes_${{ env.version }}_x64-setup.exe.sig" "artifacts/Zettel-Notes_v${{ env.version }}_x64-setup.exe.sig"

          mv "artifacts/x86_64/portable/Zettel-Notes_${{ env.version }}_x64_portable.zip" "artifacts/Zettel-Notes_v${{ env.version }}_x64_portable.zip"

          mv "artifacts/offline-installer/msi/Zettel Notes_${{ env.version }}_x64_en-US.msi" "artifacts/Zettel-Notes_v${{ env.version }}_offline_installer_x64.msi"
          mv_sig "artifacts/offline-installer/msi/Zettel Notes_${{ env.version }}_x64_en-US.msi.sig" "artifacts/Zettel-Notes_v${{ env.version }}_offline_installer_x64.msi.sig"

          mv "artifacts/offline-installer/nsis/Zettel Notes_${{ env.version }}_x64-setup.exe" "artifacts/Zettel-Notes_v${{ env.version }}_offline_installer_x64-setup.exe"
          mv_sig "artifacts/offline-installer/nsis/Zettel Notes_${{ env.version }}_x64-setup.exe.sig" "artifacts/Zettel-Notes_v${{ env.version }}_offline_installer_x64-setup.exe.sig"

      - run: |
          cp release-notes/body.md release.txt
          cat >> release.txt << EOF

          ---

          <details>

          <summary> FAQ | 常见问题 </summary>

          ## FAQ:

          ### Windows users
          - We provide an Offline Installer with built-in ​​WebView2 Runtime​​ for devices that cannot automatically install WebView2 online or are in a no-network environment. Please note that this installer is relatively large in size and is recommended to be used only when necessary.
          - The Portable ZIP can be extracted and run without installation. It uses the system WebView2 Runtime and keeps Zettel Notes' existing user-level data location. In-app updates currently launch an installer; to remain portable, download and extract the new ZIP manually.

          ### macOS users
          - Download `Zettel-Notes_v${{ env.version }}_macOS_universal.dmg`. It runs natively on both Apple Silicon and Intel Macs.
          - The app is not signed with an Apple Developer ID yet. If macOS says it "cannot be opened" because it is from an unidentified developer, go to System Settings > Privacy & Security and click "Open Anyway".
          - If macOS says the app "is damaged", open Terminal and run the following command, then open the app again:
            xattr -cr "/Applications/Zettel Notes.app"

          ## 常见问题：

          ### Windows 用户
          - 我们提供了内置 ​​WebView2 运行时​​的离线安装包（Offline Installer），适用于无法自动在线安装 WebView2 或处于无网络环境的设备。请注意，此安装包体积较大，建议仅在必要时使用.
          - Portable ZIP 解压后即可运行，无需安装；它使用系统 WebView2 Runtime，并继续使用 Zettel Notes 现有的用户级数据目录。应用内更新目前会启动安装器；如需继续使用便携版，请手动下载并解压新版 ZIP。

          ### macOS 用户
          - 请下载 `Zettel-Notes_v${{ env.version }}_macOS_universal.dmg`，它可在 Apple Silicon 和 Intel Mac 上原生运行。
          - 首次启动若提示“无法打开应用程序”（来自未识别的开发者），请前往“系统设置” > “隐私与安全性”，点击“仍要打开”。
          - 若提示“应用程序已损坏”，请打开终端执行以下命令，之后即可正常打开应用：
            xattr -cr "/Applications/Zettel Notes.app"

          </details>

          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.version }}
          name: Zettel Notes v${{ env.version }}
          body_path: release.txt
          draft: false
          # Plain tags (v1.2.3) are full releases; tags with a suffix (v1.2.3-beta.1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./artifacts/**/*

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      # Reuse the Yarn packages that main's test runs cache, to skip their download.
      - name: Restore the Yarn package cache
        uses: actions/cache/restore@v5
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup
        run: yarn setup

      - name: Updater JSON
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          # --tag: build install.json from this run's release. Without it the CLI read the first
          # v* tag GitHub listed, so a stray v0.1.0 tag broke the v0.0.12 release.
          yarn updater --token=${{ secrets.GITHUB_TOKEN }} --tag="$GITHUB_REF_NAME" --logfile=release-notes.md
          # The updater CLI can exit 0 without writing the manifest; stop here with a clear error.
          test -s apps/desktop/updater/install.json || { echo "::error::yarn updater did not write apps/desktop/updater/install.json"; exit 1; }

      - name: Upload Additional File to Same Release
        if: env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.version }}
          files: ./apps/desktop/updater/install.json
          overwrite_files: true
          fail_on_unmatched_files: true

      # GitHub Pages serves the gh-pages branch: the README as the home page, and install.json
      # for the updater endpoint in tauri.conf.json. Each release replaces both.
      - name: Stage the Pages site
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          mkdir -p pages-site
          cp ./apps/desktop/updater/install.json pages-site/install.json
          cp README.md pages-site/README.md

      - name: Deploy install.json
        if: env.HAS_SIGNING_KEY == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-site
